<aside class="sidebar">
  <div class="brand">
    <div class="logo">📝</div>
    <div class="title">Notes</div>
  </div>

  <button class="primary-btn" (click)="onCreate()">New Note</button>

  <div class="section">
    <div class="section-header">
      <span>Tags</span>
      <button class="link" (click)="toggle()">{{ expanded() ? 'Hide' : 'Show' }}</button>
    </div>

    <ul class="tags" *ngIf="expanded()">
      <li>
        <button class="tag-btn" [class.active]="!activeTag" (click)="onSelectTag(null)">
          All
        </button>
      </li>
      <li *ngFor="let tag of tags">
        <button class="tag-btn" [class.active]="tag === activeTag" (click)="onSelectTag(tag)">
          #{{ tag }}
        </button>
      </li>
    </ul>
  </div>
</aside>
