<div class="list">
  <div
    class="item"
    *ngFor="let n of notes"
    [class.active]="n.id === selectedId"
    (click)="onSelect(n.id)"
    tabindex="0"
    role="button"
    [attr.aria-label]="'Open note ' + (n.title || 'Untitled')"
  >
    <div class="item-title">{{ n.title || 'Untitled' }}</div>
    <div class="item-sub">
      <span class="tags" *ngIf="n.tags?.length">
        <span class="tag" *ngFor="let t of n.tags">#{{ t }}</span>
      </span>
      <span class="date">{{ n.updatedAt | date:'medium' }}</span>
    </div>
    <div class="preview">{{ n.content | slice:0:140 }}</div>
  </div>

  <div class="empty" *ngIf="!notes?.length">
    No notes found.
  </div>
</div>
