<div class="editor" *ngIf="note; else noSelection">
  <div class="header">
    <input
      class="title"
      [(ngModel)]="title"
      placeholder="Title"
      aria-label="Note title"
    />
    <div class="actions">
      <button class="danger" (click)="onDelete()" aria-label="Delete note">Delete</button>
      <button class="primary" (click)="onSave()" aria-label="Save note">Save</button>
    </div>
  </div>

  <textarea
    class="content"
    [(ngModel)]="content"
    placeholder="Write your note here..."
    aria-label="Note content"
    rows="12"
  ></textarea>

  <div class="tags-section">
    <div class="chips">
      <span class="chip" *ngFor="let t of tags">
        #{{ t }}
        <button class="chip-remove" (click)="removeTag(t)" [attr.aria-label]="'Remove tag ' + t">×</button>
      </span>
    </div>
    <div class="tag-inputs">
      <input
        [(ngModel)]="tagsInput"
        placeholder="Add tags (comma separated)"
        aria-label="Add tags"
      />
      <button class="secondary" (click)="applyTags()">Add</button>
    </div>
  </div>
</div>

<ng-template #noSelection>
  <div class="placeholder">
    Select a note from the list or create a new one.
  </div>
</ng-template>
